<html>

<head>
<title>PAN Card Application Form</title>
</head>

<body style="background-color:lightyellow;">

<form>

<h2>PAN Card Application Form</h2>

<fieldset>
<legend>Application Details</legend>

PAN Application Type :
<select>
<option>Select Type</option>
<option>New PAN Application</option>
<option>Change / Correction</option>
</select>

<br><br>

Applicant Category :
<select>
<option>Individual</option>
<option>Company</option>
<option>Trust</option>
<option>HUF</option>
</select>

</fieldset>

<br>

<fieldset>
<legend>Personal Details</legend>

Full Name : <br>
<input type="text"=>

<br><br>

Email : <br>
<input type="email"=>

<br><br>

Date of Birth : <br>
<input type="date">

<br><br>

Gender : <br>
<input type="radio" name="gender"> Male <br>
<input type="radio" name="gender"> Female

</fieldset>

<br>

<fieldset>
<legend>Address</legend>

Address : <br>
<textarea rows="4" cols="30"></textarea>

<br><br>

State :
<select>
<option>Maharashtra</option>
<option>Goa</option>
<option>Bihar</option>
<option>Madhya Pradesh</option>
<option>Gujarat</option>
</select>

</fieldset>

<br>

<fieldset>
<legend>Documents</legend>

Select Documents : <br>

<input type="checkbox"> Aadhar Card <br>
<input type="checkbox"> Voter ID <br>
<input type="checkbox"> Passport

</fieldset>

<br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
